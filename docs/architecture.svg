<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">Cowrie system architecture</title>
<desc id="desc">The Cowrie app uses intent and bill-flow APIs with AI providers, and syncs saved contacts through Privy authentication and Redis. Users approve transactions through a Privy wallet. PolicyVault and AjoCircleV2 execute on Monad testnet. Chainlink mainnet feeds supply Guardian prices and a seed to the CRE simulation runner. CRE reads circle state and delivers reports through MockForwarder and AjoKeeperV2.</desc>
